      <a href="#/home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>정리</a>

  <div class="row2"><button type="button" class="btn h52 danger" id="confirm-ok">모두 지우기</button><button type="button" class="btn h52 line" id="confirm-no">그만두기</button></div>
